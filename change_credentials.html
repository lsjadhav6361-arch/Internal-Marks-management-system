{% extends 'admin/layout.html' %}
{% block title %}Update Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <h3 class="text-2xl font-bold text-slate-900">Update Profile</h3>
    <p class="mt-2 text-sm text-slate-500">Change your login email/username or password.</p>

    <form method="POST" class="mt-6 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Current Password<span class="text-rose-600">*</span></label>
        <input type="password" name="current_password" class="w-full rounded-2xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">New Email/Username</label>
        <input type="email" name="new_username" class="w-full rounded-2xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" value="{{ user.username }}" placeholder="{{ user.username }}">
        <p class="mt-1 text-xs text-slate-500">Leave unchanged to keep your current email/username.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">New Password</label>
        <input type="password" name="new_password" class="w-full rounded-2xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter new password (min 6 characters)">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Confirm New Password</label>
        <input type="password" name="confirm_password" class="w-full rounded-2xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Re-enter new password">
      </div>

      <div class="flex flex-wrap gap-3 pt-2">
        <button type="submit" class="rounded-2xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white hover:bg-indigo-700">Update</button>
        <a href="{{ url_for('admin.dashboard') }}" class="rounded-2xl border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
