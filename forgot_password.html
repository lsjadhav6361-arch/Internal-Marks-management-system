{% extends 'layout.html' %}

{% block title %}Teacher Forgot Password{% endblock %}

{% block teacher_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Forgot Password</h2>
      <p class="text-sm text-slate-500 mt-1">Reset your teacher account password</p>
    </div>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" name="email" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
        <input type="text" name="phone" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">New Password</label>
        <input type="password" name="new_password" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
        <input type="password" name="confirm_password" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
        Reset Password
      </button>

      <div class="text-center">
        <a href="{{ url_for('login') }}" class="text-sm text-indigo-600 hover:underline">
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
