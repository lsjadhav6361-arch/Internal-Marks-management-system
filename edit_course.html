{% extends 'admin/layout.html' %}
{% block page_heading %}Edit Course{% endblock %}
{% block content %}<form method="post" class="max-w-2xl rounded-3xl bg-white border border-slate-200 p-6 shadow-sm space-y-4"><input type="text" name="course_name" value="{{ row.course_name }}" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required><select name="is_active" class="w-full rounded-2xl border border-slate-300 px-4 py-3"><option value="1" {{ 'selected' if row.is_active }}>Active</option><option value="0" {{ 'selected' if not row.is_active }}>Inactive</option></select><div class="flex gap-3"><button class="rounded-2xl bg-slate-950 text-white px-5 py-3 font-semibold">Update</button><a href="{{ url_for('admin.courses') }}" class="rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold">Cancel</a></div></form>{% endblock %}
