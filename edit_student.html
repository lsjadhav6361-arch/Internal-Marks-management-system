{% extends 'admin/layout.html' %}
{% block page_heading %}Edit Student{% endblock %}
{% block content %}<form method="post" class="max-w-3xl rounded-3xl bg-white border border-slate-200 p-6 shadow-sm space-y-4"><select name="academic_year" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required>{% for item in academic_years %}<option value="{{ item.label }}" {{ 'selected' if row.academic_year == item.label else '' }}>{{ item.label }}</option>{% endfor %}</select><select name="course" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required>{% for item in courses %}<option value="{{ item.course_name }}" {{ 'selected' if row.course == item.course_name else '' }}>{{ item.course_name }}</option>{% endfor %}</select><input type="number" name="semester" min="1" max="6" value="{{ row.semester }}" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required><input type="text" name="reg_no" value="{{ row.reg_no }}" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required><input type="text" name="student_name" value="{{ row.student_name }}" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required><input type="text" name="dob" value="{{ row.dob }}" class="w-full rounded-2xl border border-slate-300 px-4 py-3" required><input type="text" name="section" value="{{ row.section or '' }}" class="w-full rounded-2xl border border-slate-300 px-4 py-3"><div class="flex gap-3"><button class="rounded-2xl bg-slate-950 text-white px-5 py-3 font-semibold">Update Student</button><a href="{{ url_for('admin.students') }}" class="rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold">Cancel</a></div></form>{% endblock %}
